name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake curl valgrind

      - name: Build standalone static binary
        run: ./scripts/build_static.sh

      - name: Run CTest
        run: ctest --test-dir build-static --output-on-failure

      - name: Verify binary is not dynamic
        run: |
          file build-static/heic2tiff
          ! ldd build-static/heic2tiff
